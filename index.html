<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Conversapp - Chamada</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="window">
            <div class="titlebar">
                <div class="dots">
                    <span class="dot dot-close"></span>
                    <span class="dot dot-min"></span>
                    <span class="dot dot-max"></span>
                </div>
                <span class="titlebar-label">Chamada ativa</span>
                <div class="titlebar-spacer"></div>
            </div>

            <div class="call-area">
                <div class="avatar-wrap">
                    <div class="pulse-ring"></div>
                    <div class="pulse-ring"></div>
                    <div class="avatar">
                        <img id="user-avatar" src="" alt="avatar" />

                        <!-- fallback SVG (oculto por padrão) -->
                        <svg
                            id="avatar-fallback"
                            viewBox="0 0 60 60"
                            xmlns="http://www.w3.org/2000/svg"
                            style="display: none"
                        >
                            <circle cx="30" cy="22" r="13" />
                            <path d="M8 54c0-12 10-22 22-22s22 10 22 22H8z" />
                        </svg>
                    </div>
                </div>

                <div class="user-name" id="user-name">User Name</div>
                <div class="call-timer" id="timer">00:00</div>

                <div class="status-tag">
                    <span class="status-dot"></span>
                    Conectado
                </div>
            </div>

            <div class="controls">
                <button
                    class="ctrl-btn btn-mic"
                    id="micBtn"
                    data-tip="Microfone"
                >
                    <!-- Mic ON -->
                    <svg id="icon-mic-on" viewBox="0 0 24 24">
                        <path
                            d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V20H9v2h6v-2h-2v-2.07A7 7 0 0 0 19 11h-2z"
                        />
                    </svg>
                    <!-- Mic OFF -->
                    <svg
                        id="icon-mic-off"
                        viewBox="0 0 24 24"
                        style="display: none"
                    >
                        <path
                            d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V20H9v2h6v-2h-2v-2.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"
                        />
                    </svg>
                </button>

                <button
                    class="ctrl-btn btn-end"
                    id="endBtn"
                    data-tip="Encerrar"
                >
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"
                        />
                    </svg>
                </button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
